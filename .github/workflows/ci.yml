name: FundUp CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js in GitHub Runner
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 3. Test Frontend Linting & Build
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Linter
        run: |
          cd frontend
          npm run lint

      - name: Run Frontend Production Build
        run: |
          cd frontend
          npm run build

      # 4. Start Docker Containers & Test Backend APIs
      - name: Start Docker Containers
        run: |
          docker compose up -d --build

      - name: Wait for Backend API to be Ready
        run: |
          echo "Waiting for Backend API and MySQL to respond with 200 OK..."
          timeout 90s bash -c 'until curl -s http://localhost:8000/api/public/getHomeStats.php | grep -q "\"success\":true"; do echo "Waiting for backend..."; sleep 3; done'
          echo "Backend and Database are fully online and responding!"

      - name: Run Backend Automated API Tests
        run: |
          node backend/tests/api_test.js

      # 5. Debug info if any test fails
      - name: Print Container Logs on Failure
        if: failure()
        run: |
          echo "=================== Backend Container Logs ==================="
          docker compose logs backend
          echo "=================== Database Container Logs ==================="
          docker compose logs db

      # 6. Clean up containers after testing
      - name: Stop Docker Containers
        if: always()
        run: |
          docker compose down -v
